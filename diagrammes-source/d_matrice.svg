<text x="449" y="176" font-size="11" font-weight="700" fill="#16181d">7</text>
<rect x="500" y="158" width="56" height="24" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
<text x="528" y="174" text-anchor="middle" font-size="10" font-weight="700" fill="#78350f">oui</text>
<text x="630" y="176" font-size="10" fill="#4a4f5a">lie au cycle FIM</text>
<rect x="18" y="198" width="784" height="56" fill="#fffdfa" stroke="#e3ded5" stroke-width="1"/>
<text x="26" y="222" font-size="10.5" font-weight="700" fill="#16181d">3 &#183; Injection SQL dans une URL</text>
<text x="26" y="240" font-size="9.5" fill="#848a96">journal d'acces nginx de web-01</text>
