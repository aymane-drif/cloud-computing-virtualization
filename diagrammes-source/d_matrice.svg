<text x="630" y="232" font-size="10" fill="#4a4f5a">moins de 5 s</text>
<rect x="18" y="254" width="784" height="56" fill="#fffdfa" stroke="#e3ded5" stroke-width="1"/>
<text x="26" y="278" font-size="10.5" font-weight="700" fill="#16181d">4 &#183; Ajout d'un compte au groupe sudo</text>
