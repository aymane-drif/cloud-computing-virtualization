<text x="26" y="334" font-size="10.5" font-weight="700" fill="#16181d">5 &#183; Echecs d'authentification applicatifs</text>
<text x="26" y="352" font-size="9.5" fill="#848a96">journal maison de app-01, format non standard</text>
<text x="300" y="344" font-size="10" font-family="'JetBrains Mono', monospace" fill="#4a4f5a">aucune</text>
<text x="449" y="344" font-size="11" font-weight="700" fill="#16181d">&#8212;</text>
<rect x="500" y="326" width="56" height="24" rx="12" fill="#fdeaea" stroke="#b91c1c" stroke-width="1.3"/>
<text x="528" y="342" text-anchor="middle" font-size="10" font-weight="700" fill="#7f1d1d">non</text>
<text x="630" y="344" font-size="10" fill="#4a4f5a">non detecte</text>
<rect x="18" y="380" width="784" height="86" rx="6" fill="#fdeaea" stroke="#b91c1c" stroke-width="1.5"/>
<text x="32" y="404" font-size="10.5" font-weight="700" fill="#7f1d1d">La ligne 5 est le projet. Les quatre autres sont le banc d'essai.</text>
<text x="32" y="424" font-size="10" fill="#991b1b">Les scenarios 1 a 4 sont couverts par le jeu de regles livre : les montrer prouve que la chaine fonctionne, pas que nous l'avons comprise.</text>
<text x="32" y="441" font-size="10" fill="#991b1b">Le scenario 5 passe sous le radar parce que le format du journal est propre a l'application. Il faut ecrire le decodeur, puis deux regles :</text>
<text x="32" y="458" font-size="10" font-family="'JetBrains Mono', monospace" fill="#7f1d1d">100001 (niveau 5, une par echec) puis 100002 (niveau 10, frequency=5 timeframe=60). C'est la seule partie que personne d'autre n'a ecrite.</text>
<text x="18" y="490" font-size="10" fill="#848a96">Le faux negatif est declare volontairement : un tableau ou tout est detecte ne demontre qu'une installation reussie.</text>
