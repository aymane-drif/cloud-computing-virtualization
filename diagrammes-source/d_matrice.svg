<text x="18" y="24" font-size="11" font-weight="700" fill="#16181d">MATRICE DE DETECTION &#183; CINQ SCENARIOS CONFRONTES AU JEU DE REGLES PAR DEFAUT</text>
<text x="18" y="42" font-size="10" fill="#848a96">Chaque scenario est un script horodate. La derniere colonne est renseignee par la mesure, pas par l'intention.</text>
