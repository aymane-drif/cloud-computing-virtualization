apiVersion: 1

groups:
  - orgId: 1
    name: detection
    folder: SOC
    # Intervalle court volontairement : en soutenance, personne n'attend
    # cinq minutes devant un ecran pour voir arriver une notification.
    interval: 10s
    rules:
      - uid: alerte-niveau-eleve
        title: Alerte de securite niveau 10 ou plus
        condition: seuil
        for: 0s
        annotations:
          summary: "Au moins une alerte de niveau >= 10 dans la derniere minute"
        labels:
          severite: haute
        data:
          - refId: requete
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: wazuh-indexer-ds
            model:
              format: table
              query: "rule.level:>=10"
              timeField: timestamp
              bucketAggs: []
              metrics:
                - id: "1"
                  type: count
          - refId: seuil
            datasourceUid: __expr__
            model:
              type: threshold
              expression: requete
              conditions:
                - evaluator: { type: gt, params: [0] }
