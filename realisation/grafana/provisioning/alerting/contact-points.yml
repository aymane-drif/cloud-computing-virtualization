apiVersion: 1

contactPoints:
  - orgId: 1
    name: recepteur-webhook
    receivers:
      - uid: recepteur-001
        type: webhook
        settings:
          url: http://recepteur:8000/alerte
          httpMethod: POST

policies:
  - orgId: 1
    receiver: recepteur-webhook
    group_by: ['alertname']
    group_wait: 5s
    group_interval: 10s
    repeat_interval: 1h
