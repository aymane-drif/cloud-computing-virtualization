apiVersion: 1

datasources:
  - name: Wazuh Indexer
    uid: wazuh-indexer-ds
    type: grafana-opensearch-datasource
    access: proxy
    url: https://wazuh-indexer:9200
    basicAuth: true
    basicAuthUser: admin
    isDefault: true
    jsonData:
      flavor: OpenSearch
      version: 2.13.0
      timeField: "timestamp"
      database: "wazuh-alerts-*"
      tlsSkipVerify: true
      maxConcurrentShardRequests: 5
      logMessageField: "rule.description"
      logLevelField: "rule.level"
    secureJsonData:
      basicAuthPassword: ${INDEXER_PASSWORD}
    editable: true
